[project]
name = "ilr-pso-ipopt"
version = "0.1.0"
description = "Generic ILR-PSO + IPOPT optimizer for fixed-sum (simplex) allocation problems in Pyomo models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyomo>=6.5",
    "mealpy>=3.0",
]
[project.optional-dependencies]
dev = ["pytest"]
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
